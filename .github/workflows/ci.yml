name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Python syntax check
        run: |
          python -m py_compile main.py
          python -m py_compile app_factory.py
          python -m py_compile dashboard_api.py

      - name: Verify no secrets in code
        run: |
          if grep -rE '(WHATSAPP_API_KEY|WHATSAPP_ACCESS_TOKEN)\s*=\s*["'"'"'][^"'"'"' ]{8,}' *.py; then
            echo "ERROR: Hardcoded secret found"
            exit 1
          fi
          echo "No hardcoded secrets found"